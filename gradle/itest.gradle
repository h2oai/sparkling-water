import org.gradle.api.tasks.testing.logging.TestExceptionFormat

apply from: "$rootDir/gradle/utils.gradle"

sourceSets {
    integTest {
        scala {
            srcDirs = ['src/integTest/scala', 'src/main/scala']
        }
        resources {
            srcDirs = ['src/integTest/resources', 'src/main/resources']
        }

        compileClasspath += main.output + test.output
        runtimeClasspath += main.output + test.output
    }
}

configurations {
    integTestImplementation.extendsFrom testImplementation
    integTestRuntimeOnly.extendsFrom testRuntimeOnly
}

task integTest(type: Test) {
    group = 'Verification'
    description = 'Runs all integration tests'
    testClassesDirs = sourceSets.integTest.output.classesDirs
    classpath = sourceSets.integTest.runtimeClasspath

    // Required for Java 9+ module system (driver/test JVM only):
    // - RestCommunication uses sun.net.www.protocol.*
    // - Kryo serialization of HeapByteBuffer requires java.nio access
    // - Kryo ScalaCollectionsRegistrar accesses java.lang.invoke.SerializedLambda fields
    // - Kryo ScalaCollectionsRegistrar accesses java.util.AbstractList.modCount when
    //   Word2Vec triggers a shuffle (only needed on driver, not executors)
    jvmArgs += [
        '--add-opens', 'java.base/sun.net.www.protocol.http=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.net.www.protocol.https=ALL-UNNAMED',
        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    ]

    // Run with assertions ON
    enableAssertions = true
    // For a new JVM for each test class
    forkEvery = 1
    // Working dir will be root project
    workingDir = rootDir
    // Increase test runner memory
    maxHeapSize = "4g"

    systemProperty "spark.ext.h2o.log.dir", new File(project.getBuildDir(), "h2ologs-itest/nodes")
    systemProperty "spark.ext.h2o.external.disable.version.check", "true"
    systemProperty "spark.ext.h2o.backend.cluster.mode", detectBackendClusterMode()
    systemProperty "spark.testing", "true"
    systemProperty "spark.test.home", "${sparkHome}"

    // Pass --add-opens to Spark driver and executors:
    // - RestCommunication uses sun.net.www.protocol.*
    // - Kryo serialization of ByteBuffer requires java.nio (Craigslist tf_idf demo)
    def addOpens = "--add-opens java.base/sun.net.www.protocol.http=ALL-UNNAMED --add-opens java.base/sun.net.www.protocol.https=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED"
    systemProperty "spark.driver.extraJavaOptions", addOpens
    systemProperty "spark.executor.extraJavaOptions", addOpens

    // Also setup expected Scala version for Spark launcher
    environment "SPARK_SCALA_VERSION", "$scalaBaseVersion"

    testLogging {
        showCauses = true
        showExceptions = true
        showStackTraces = true
        exceptionFormat = TestExceptionFormat.FULL

        // Show standard out and standard error of the test JVM(s) on the console
        showStandardStreams = true
    }
}


// Run integration tests as part of build
check.dependsOn integTest
