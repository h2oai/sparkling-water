rootProject.name = 'sparkling-water'

def detectSparkMajorVersion() {
  // Prefer -Pspark=... if provided, otherwise fall back to gradle.properties
  def sparkProp = gradle.startParameter.projectProperties.get("spark")
  if (sparkProp != null) {
    return sparkProp.toString()
  }
  def props = new Properties()
  file('gradle.properties').withInputStream { props.load(it) }
  return props.getProperty('spark')
}

def sparkMajorVersion = detectSparkMajorVersion()
def includeRepl = !(sparkMajorVersion != null && sparkMajorVersion.startsWith("4."))

include 'api-generation'
include 'core'
include 'examples'
include 'ml'
include 'assembly'
include 'assembly-scoring'
include 'assembly-extensions'
include 'py'
include 'py-scoring'
include 'r'
include 'r-cran'
if (includeRepl) {
  include 'repl'
}
include 'package'
include 'scoring-package'
include 'doc'
include 'extensions'
include 'templates'
include 'benchmarks'
include 'dist'
include 'macros'
include 'ci'
include 'utils'
include 'scoring'
include 'kubernetes'
include 'booklet'

// Prefix all projects with sparkling-water name
rootProject.children.each { project ->
  project.name = rootProject.name + "-" + project.name
}
